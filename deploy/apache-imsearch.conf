# Apache で公開する場合の例（専用のホスト名で公開: https://imsearch.example.com/）
#
# 配置と有効化（Ubuntu）:
#   sudo apt install apache2
#   sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/apache-imsearch.conf /etc/apache2/sites-available/imsearch.conf
#   sudo nano /etc/apache2/sites-available/imsearch.conf     # ServerName を自分のドメインに
#   sudo a2ensite imsearch && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d imsearch.example.com            # HTTPS（443 の設定を自動で追加）
#
# 既存のサイト（INTER-Mediator のアプリを公開しているサーバーなど）の /imsearch/ 以下に
# 置く場合は deploy/apache-imsearch-subpath.conf を使う。
#
# imsearch serve は 127.0.0.1:8000 で待ち受ける（deploy/imsearch-web.service）。
# Apache には nginx の limit_req に当たる機能が標準で無いので、回答の回数制限は
# imsearch 側で行う: imsearch.env に IMSEARCH_WEB_ASK_PER_MIN=6（IP ごとに 1 分 6 回）。

<VirtualHost *:80>
    ServerName imsearch.example.com
    # ServerAdmin webmaster@example.com

    ProxyRequests Off
    ProxyPreserveHost On
    # X-Forwarded-For は mod_proxy が付ける（imsearch は 127.0.0.1 からの値を信用して
    # クライアントの IP とみなす）。https で受けたことも伝える。
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # 回答（Server-Sent Events）: 届いたトークンをすぐ送る（flushpackets）。
    # 生成は CPU だと数分かかるので、応答待ちの上限を長くする（IMSEARCH_LLM_TIMEOUT と同じ 900 秒）。
    # 圧縮すると逐次表示できなくなるので mod_deflate を外す。
    # 127.0.0.1 と書く（localhost だと ::1 で接続し、imsearch が転送元として信用しない）。
    ProxyPass        /api/ask http://127.0.0.1:8000/api/ask flushpackets=on timeout=900
    ProxyPassReverse /api/ask http://127.0.0.1:8000/api/ask
    SetEnvIf Request_URI "^/api/ask" no-gzip dont-vary

    # 画面・検索・API ドキュメント
    ProxyPass        / http://127.0.0.1:8000/ timeout=60
    ProxyPassReverse / http://127.0.0.1:8000/

    # 大きな本文は受け付けない（質問は 500 文字まで）。LimitRequestBody はプロキシする要求には
    # 効かない（Apache 2.4.58 で確認）ので、Content-Length で断る（403）。
    <If "%{REQUEST_URI} =~ m#^/api/# && %{HTTP:Content-Length} -gt 16384">
        Require all denied
    </If>

    ErrorLog ${APACHE_LOG_DIR}/imsearch-error.log
    CustomLog ${APACHE_LOG_DIR}/imsearch-access.log combined
</VirtualHost>
