# nginx で公開する場合の例（/etc/nginx/sites-available/imsearch）
# imsearch serve は 127.0.0.1:8000 で待ち受け、nginx が外部からの接続を受ける。
# HTTPS 化は certbot --nginx などで行う。
limit_req_zone $binary_remote_addr zone=imsearch_ask:10m rate=6r/m;

server {
    listen 80;
    server_name imsearch.example.com;   # ← 自分のドメインに変更

    client_max_body_size 16k;

    location /api/ask {
        limit_req zone=imsearch_ask burst=3 nodelay;   # 回答生成は重いので IP ごとに制限
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # Server-Sent Events を逐次届ける
        proxy_read_timeout 900s;      # CPU での生成は数分かかる
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
