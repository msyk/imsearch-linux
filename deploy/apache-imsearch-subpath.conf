# Apache の既存サイトの /imsearch/ 以下で公開する場合の例（https://www.example.com/imsearch/）
#
# INTER-Mediator のアプリを公開している Apache に相乗りするときなど。
#   sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/apache-imsearch-subpath.conf /etc/apache2/imsearch-subpath.conf
#   既存の <VirtualHost>（certbot が作った *-le-ssl.conf なら 443 側）の中に 1 行追加:
#       Include /etc/apache2/imsearch-subpath.conf
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# imsearch.env にも次を書いて imsearch-web を再起動する（API ドキュメント /imsearch/api/docs 用。
# 画面は相対 URL なので、これが無くても動く）:
#   IMSEARCH_WEB_ROOT_PATH=/imsearch
#   IMSEARCH_WEB_ASK_PER_MIN=6        # 回答は IP ごとに 1 分 6 回まで（Apache 側に制限が無いため）
#
# パスを変えるときは、下の /imsearch と IMSEARCH_WEB_ROOT_PATH をそろえて変える。

# 末尾の / が無いと画面の相対 URL がずれるので付けさせる
RedirectMatch 301 ^/imsearch$ /imsearch/

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

# 回答（Server-Sent Events）: 逐次送る・長く待つ・圧縮しない
ProxyPass        /imsearch/api/ask http://127.0.0.1:8000/api/ask flushpackets=on timeout=900
ProxyPassReverse /imsearch/api/ask http://127.0.0.1:8000/api/ask
SetEnvIf Request_URI "^/imsearch/api/ask" no-gzip dont-vary

ProxyPass        /imsearch/ http://127.0.0.1:8000/ timeout=60
ProxyPassReverse /imsearch/ http://127.0.0.1:8000/

# 大きな本文は受け付けない（質問は 500 文字まで）。LimitRequestBody はプロキシする要求には
# 効かない（Apache 2.4.58 で確認）ので、Content-Length で断る（403）。
<If "%{REQUEST_URI} =~ m#^/imsearch/api/# && %{HTTP:Content-Length} -gt 16384">
    Require all denied
</If>
