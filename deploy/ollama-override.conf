# /etc/systemd/system/ollama.service.d/override.conf
# Ollama settings for a 2GB RAM machine (installed by scripts/setup-ubuntu.sh)
# With 4GB or more: OLLAMA_MAX_LOADED_MODELS=2, MemoryHigh=3000M, MemoryMax=3500M
[Service]
# one model in RAM at a time: the chat model (~1.4GB with a 4K context) and the embedding
# model (~0.9GB) are swapped per request; reloading from the file cache takes ~2s
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# one request at a time: each parallel slot multiplies the KV cache
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_QUEUE=16"
# halve the KV cache (q8_0 needs flash attention)
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# free RAM soon after use (imsearch also sends keep_alive per request)
Environment="OLLAMA_KEEP_ALIVE=10m"
# only listen locally
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Protect the rest of the system (sshd etc.): above MemoryHigh the kernel reclaims Ollama's
# pages (the mmapped model file first, then anon pages to swap); at MemoryMax only Ollama's
# model runner is OOM-killed. Measured: answering peaks at ~1.4GB anon; a 1.7GB cap slowed
# generation by under 10%.
MemoryHigh=1600M
MemoryMax=1800M
OOMScoreAdjust=500
