[project]
name = "imsearch"
version = "0.1.0"
description = "INTER-Mediator developer search (local RAG with Ollama, low-memory Linux edition)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "markdownify>=0.13",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-javascript>=0.23",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
imsearch = "imsearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["imsearch"]

[tool.setuptools.package-data]
imsearch = ["static/*"]
